services:
  - type: web
    name: laundrytrack
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: PYTHON_VERSION
        value: "3.12.6"
